name: CI

on:
  push:
    branches: [main, "agent/**", "improvements/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . --no-cache
      - name: Type check
        run: mypy synthmarket
        continue-on-error: true
      - name: Tests with coverage
        run: python -m pytest -p no:cacheprovider --cov=synthmarket --cov-report=term-missing
      - name: Compile
        run: python -m compileall synthmarket tests examples

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install -U pip-audit
      - name: Audit dependencies
        run: pip-audit --strict
