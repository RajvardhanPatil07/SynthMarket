[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthmarket"
version = "0.3.0"
description = "Reproducible synthetic financial time-series generation and stress-testing research platform."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rajvardhan Patil", email = "Rajvardhanpatil7890@gmail.com" }]
maintainers = [{ name = "Rajvardhan Patil", email = "Rajvardhanpatil7890@gmail.com" }]
license = { text = "MIT" }
keywords = ["synthetic-data", "time-series", "finance", "gan", "wgan-gp", "backtesting", "risk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<3",
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "yfinance>=0.2,<2",
    "matplotlib>=3.7,<4",
]

[project.scripts]
synthmarket = "synthmarket.cli:main"
synthmarket-web = "synthmarket.web:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]
all = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[project.urls]
Homepage = "https://github.com/RajvardhanPatil07/SynthMarket"
Repository = "https://github.com/RajvardhanPatil07/SynthMarket"
Issues = "https://github.com/RajvardhanPatil07/SynthMarket/issues"
Changelog = "https://github.com/RajvardhanPatil07/SynthMarket/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthmarket*"]

[tool.setuptools.package-data]
synthmarket = ["static/*", "static/assets/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["synthmarket"]
omit = ["synthmarket/web.py", "synthmarket/static/*"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
